<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s02 (diagram). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/camera.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s02" data-start="0" data-duration="9.5" data-width="1920" data-height="1080"
     data-transition-in="cut" data-transition-out="cut" data-transition-duration="0"
     style="--w: 1920px; --h: 1080px">
  <link rel="x-world" href="../worlds/gps.html" />
  <div class="os-world" data-world="gps" data-world-w="4266" data-world-h="2400" data-camera="{&quot;from&quot;:{&quot;x&quot;:2133,&quot;y&quot;:1200,&quot;zoom&quot;:1},&quot;to&quot;:&quot;sat2&quot;,&quot;move&quot;:&quot;push&quot;,&quot;dur&quot;:3.4}" data-enter-state="{&quot;screen&quot;:&quot;fixed&quot;}" data-exit-state="{&quot;screen&quot;:&quot;fixed&quot;,&quot;sat2&quot;:&quot;open&quot;,&quot;tick&quot;:&quot;at-sat2&quot;}"></div>
  <div class="os-frame clip" data-start="0" data-duration="9.5" data-track-index="0" style="pointer-events: none">
  </div>
</div>
<script>
  const S = OS.scene("s02");
  const EX = 110; // how far the satellite shell opens (matches --ex of the open state)
  const REST = 60; // resting hand angle in degrees (a full turn of steps returns to it)
  const SAT = { 1: [810, 540], 2: [1640, 310], 3: [2640, 340], 4: [3500, 600] };
  const PHONE = [2210, 1430];
  const WHOLE = { x: 2133, y: 1200, zoom: 1 };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const smooth = (u) => u * u * (3 - 2 * u);
  const el = (sel) => S.q(sel)[0];
  // The signal pulse: its place is the --tx / --ty pair; pop sets its look.
  const setTick = (id, x, y, scale, alpha) => {
    const g = el("#" + id), body = g.firstElementChild;
    g.style.setProperty("--tx", x);
    g.style.setProperty("--ty", y);
    body.style.opacity = alpha;
    body.style.transform = "scale(" + scale + ")";
  };
  const setHand = (sel, deg, len) => {
    const h = el(sel), a = (deg * Math.PI) / 180;
    h.setAttribute("x2", (len * Math.sin(a)).toFixed(2));
    h.setAttribute("y2", (-len * Math.cos(a)).toFixed(2));
  };

  // Satellite two opens like a cutaway: the shell parts, the atomic clock sits in the middle and ticks, a pulse leaves it.
  const sat = el("#sat2"), lbl = el("#sat2 .g-lbl");
  S.camera(WHOLE, "sat2", { move: "push", dur: 3.4, ease: "power2.inOut" });
  const openAt = 3.2, openLen = 1.2, handAt = 4.6, popAt = S.line("s02-2", 6.4) + 0.2;
  S.state("sat2", "open", { at: openAt + openLen });
  S.state("tick", "at-sat2", { at: popAt });
  S.drive((t) => {
    const o = smooth(clamp((t - openAt) / openLen));
    sat.style.setProperty("--ex", (EX * o).toFixed(3));
    lbl.style.opacity = clamp((t - openAt - 0.6) / 0.5);
    const deg = REST + 30 * Math.floor(clamp((t - handAt) / 0.2, 0, 12) + 1e-9);
    setHand("#sat2 .g-hand", deg, 31);
    setHand("#sat2 .g-bhand", deg, 15);
    const p = clamp((t - popAt) / 0.4);
    setTick("tick", SAT[2][0], SAT[2][1], 0.4 + 0.6 * (1 - Math.pow(1 - p, 3)), p);
  }, { at: 0 });
  S.done();
</script>
</body>
</html>
