<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s05 (diagram). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/camera.js"></script>
<script src="../assets/brand.js"></script>
<!-- studio preview of storyboard SFX cues (never in renders; the final mix is FFmpeg's) -->
<script src="../assets/vendor/howler.core.min.js"></script>
<script src="../assets/audio-cues.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s05" data-start="0" data-duration="10" data-width="1920" data-height="1080"
     data-transition-in="cut" data-transition-out="cut" data-transition-duration="0"
     style="--w: 1920px; --h: 1080px">
  <link rel="x-world" href="../worlds/gps.html" />
  <div class="os-world" data-world="gps" data-world-w="4266" data-world-h="2400" data-camera="{&quot;from&quot;:&quot;circles&quot;,&quot;to&quot;:{&quot;x&quot;:2133,&quot;y&quot;:1200,&quot;zoom&quot;:1},&quot;move&quot;:&quot;push&quot;,&quot;at&quot;:6.9}" data-enter-state="{&quot;screen&quot;:&quot;fixed&quot;,&quot;tick&quot;:&quot;at-phone&quot;,&quot;trail&quot;:&quot;on&quot;,&quot;arcs3&quot;:&quot;on&quot;,&quot;fix&quot;:&quot;on&quot;}" data-exit-state="{&quot;screen&quot;:&quot;fixed&quot;,&quot;tick&quot;:&quot;at-phone&quot;,&quot;trail&quot;:&quot;on&quot;,&quot;arcs3&quot;:&quot;on&quot;,&quot;fix&quot;:&quot;on&quot;,&quot;arc4&quot;:&quot;on&quot;,&quot;sat4&quot;:&quot;hl&quot;,&quot;beams&quot;:&quot;on&quot;}"></div>
  <div class="os-frame clip" data-start="0" data-duration="10" data-track-index="0" style="justify-content: flex-start; align-items: flex-start; padding-top: calc(190 * var(--u))">
    <div class="os-card ns" style="text-align: center">
      <div class="os-h1 os-accent">1 ns ≈ 30 cm</div>
      <div class="os-small os-muted">một phần tỷ giây lệch</div>
    </div>
  </div>
</div>
<script>
  const S = OS.scene("s05");
  const EX = 110; // how far the satellite shell opens (matches --ex of the open state)
  const REST = 60; // resting hand angle in degrees (a full turn of steps returns to it)
  const SAT = { 1: [810, 540], 2: [1640, 310], 3: [2640, 340], 4: [3500, 600] };
  const PHONE = [2210, 1430];
  const WHOLE = { x: 2133, y: 1200, zoom: 1 };
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const smooth = (u) => u * u * (3 - 2 * u);
  const el = (sel) => S.q(sel)[0];
  // The signal pulse: its place is the --tx / --ty pair; pop sets its look.
  const setTick = (id, x, y, scale, alpha) => {
    const g = el("#" + id), body = g.firstElementChild;
    g.style.setProperty("--tx", x);
    g.style.setProperty("--ty", y);
    body.style.opacity = alpha;
    body.style.transform = "scale(" + scale + ")";
  };
  const setHand = (sel, deg, len) => {
    const h = el(sel), a = (deg * Math.PI) / 180;
    h.setAttribute("x2", (len * Math.sin(a)).toFixed(2));
    h.setAttribute("y2", (-len * Math.cos(a)).toFixed(2));
  };

  // A cheap clock puts every circle in the wrong place; the fourth satellite lets the phone solve for its own clock error.
  const wrongAt = S.line("s05-1", 0) + 0.4;
  const fourthAt = S.line("s05-2", 5.2);
  const fixedAt = fourthAt + 1.7;
  S.state("arcsOff", "on", { at: 0 });
  S.tl.to("#arcs3", { opacity: 0, duration: 0.4 }, wrongAt);
  S.tl.fromTo("#arcsOff", { opacity: 0 }, { opacity: 1, duration: 0.4 }, wrongAt);
  S.tl.to("#fix", { opacity: 0.25, duration: 0.4 }, wrongAt);
  S.enter(".ns", { at: S.line("s05-1", 0) + 2.6, kind: "up" });
  S.state("sat4", "hl", { at: fourthAt });
  S.state("arc4", "on", { at: fourthAt });
  S.draw("#arc4 path", { at: fourthAt + 0.2, dur: 1.2 });
  S.tl.to("#arcsOff", { opacity: 0, duration: 0.4 }, fixedAt);
  S.tl.to("#arcs3", { opacity: 1, duration: 0.4 }, fixedAt);
  S.tl.to("#fix", { opacity: 1, duration: 0.4 }, fixedAt);
  S.tl.to(".ns", { autoAlpha: 0, duration: 0.3 }, fourthAt);
  S.camera("circles", WHOLE, { move: "push", at: fixedAt + 0.2, ease: "power2.inOut" });
  S.state("beams", "on", { at: fixedAt + 1.6 });
  S.draw("#beams path", { at: fixedAt + 1.6, dur: 1.1, stagger: 0.15 });
  S.done();
</script>
</body>
</html>
