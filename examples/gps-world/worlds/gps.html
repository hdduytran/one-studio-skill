<!-- GPS world: the sky, four satellites with clocks, a person at a crossroads and the signal that links them (4266 x 2400 units, 1 unit = 1px).
     Schematic, not to scale. Camera targets are the data-place boxes. Look changes are data-state values (see the style block);
     motion belongs to the scenes' timelines. Brand variables only, no CSS transitions or animations. Generated once, then edited by hand. -->
<style>
  .g-world { position: absolute; left: 0; top: 0; width: 4266px; height: 2400px; }
  .g-art { position: absolute; left: 0; top: 0; }
  .g-place { position: absolute; }
  .g-star { fill: var(--c-fg); }
  .g-light { fill: var(--c-accent); }
  .g-earth { fill: url(#g-earth-fill); }
  .g-rim { fill: none; stroke: var(--c-primary); stroke-width: 6; stroke-opacity: .95; }
  .g-glow1 { fill: none; stroke: var(--c-primary); stroke-width: 40; stroke-opacity: .13; }
  .g-glow2 { fill: none; stroke: var(--c-primary); stroke-width: 110; stroke-opacity: .06; }
  .g-grid { fill: none; stroke: var(--c-fg); stroke-opacity: .09; stroke-width: 2; }
  .g-bld { fill: var(--c-bg); stroke: var(--c-primary); stroke-opacity: .55; stroke-width: 4; }
  .g-win { fill: var(--c-fg); fill-opacity: .1; }
  .g-win-on { fill: var(--c-accent); fill-opacity: .8; }
  .g-road { fill: none; stroke: var(--c-fg); stroke-opacity: .16; stroke-width: 30; }
  .g-zebra { fill: var(--c-fg); fill-opacity: .55; }
  .g-pole { fill: var(--c-fg); fill-opacity: .5; }
  .g-body, .g-leg, .g-head { fill: var(--c-fg); fill-opacity: .92; }
  .g-arm { stroke: var(--c-fg); stroke-opacity: .92; stroke-width: 15; stroke-linecap: round; }
  .g-phone { fill: var(--c-bg); stroke: var(--c-fg); stroke-width: 4; }
  .g-phone-screen { fill: var(--c-primary); fill-opacity: .85; }
  .g-call { stroke: var(--c-fg); stroke-opacity: .22; stroke-width: 3; }
  .g-card { fill: var(--c-bg); stroke: var(--c-fg); stroke-opacity: .4; stroke-width: 4; }
  .g-map line { stroke: var(--c-muted); stroke-opacity: .4; stroke-width: 3; }
  .scr-search { fill: none; stroke: var(--c-muted); stroke-width: 4; stroke-dasharray: 10 12; }
  .scr-fixed { opacity: 0; }
  .scr-halo { fill: var(--c-primary); fill-opacity: .22; }
  .scr-ring { fill: var(--c-fg); }
  .scr-dot { fill: var(--c-primary); }
  #screen[data-state="fixed"] .scr-fixed { opacity: 1; }
  #screen[data-state="fixed"] .scr-search { opacity: 0; }
  .g-dim { stroke: var(--c-muted); stroke-opacity: .5; stroke-width: 3; stroke-dasharray: 14 14; }
  .g-note { fill: var(--c-muted); font-family: var(--font-body); font-size: 32px; }
  .g-dimlbl { fill: var(--c-muted); font-family: var(--font-mono); font-size: 40px; }
  /* satellites: --ex is how far the shell has opened; the open state sets it, scenes animate it */
  .g-sat { --ex: 0; }
  .g-sat[data-state="open"] { --ex: 110; }
  .g-sat .p-l { transform: translateX(calc(var(--ex) * -1.4px)); }
  .g-sat .p-r { transform: translateX(calc(var(--ex) * 1.4px)); }
  .g-sat .p-top { transform: translateY(calc(var(--ex) * -1px)); }
  .g-sat .p-bot { transform: translateY(calc(var(--ex) * 1px)); }
  .g-hull { fill: var(--c-bg); stroke: var(--c-fg); stroke-opacity: .75; stroke-width: 5; }
  .g-bayrect { fill: var(--c-bg); stroke: var(--c-fg); stroke-opacity: .45; stroke-width: 4; }
  .g-panel { fill: var(--c-primary); fill-opacity: .22; stroke: var(--c-primary); stroke-width: 5; }
  .g-pgrid line { stroke: var(--c-primary); stroke-opacity: .6; stroke-width: 2; }
  .g-strut { stroke: var(--c-fg); stroke-opacity: .6; stroke-width: 6; }
  .g-dish { fill: var(--c-bg); stroke: var(--c-fg); stroke-opacity: .7; stroke-width: 4; }
  .g-face { fill: var(--c-bg); stroke: var(--c-accent); stroke-width: 5; }
  .g-ticks line { stroke: var(--c-accent); stroke-width: 3; }
  .g-badge .g-face { stroke-width: 4; }
  .g-bhand { stroke: var(--c-accent); stroke-width: 4; stroke-linecap: round; }
  .g-hand { stroke: var(--c-accent); stroke-width: 5; stroke-linecap: round; }
  .g-pivot { fill: var(--c-accent); }
  .g-atom ellipse { fill: none; stroke: var(--c-fg); stroke-opacity: .5; stroke-width: 2; }
  .g-atom circle { fill: var(--c-fg); fill-opacity: .7; }
  .g-circuit path { fill: none; stroke: var(--c-primary); stroke-opacity: .6; stroke-width: 3; }
  .g-lbl { fill: var(--c-fg); font-family: var(--font-body); font-size: 26px; opacity: 0; }
  .g-sat[data-state="open"] .g-lbl { opacity: 1; }
  .g-halo { fill: none; stroke: var(--c-accent); stroke-width: 7; stroke-dasharray: 3 22; stroke-linecap: round; opacity: 0; }
  .g-sat[data-state="hl"] .g-halo { opacity: 1; }
  /* the tick: the signal pulse that runs through the whole video; its place is set by --tx / --ty */
  .g-tick { --tx: 1640; --ty: 310; transform: translate(calc(var(--tx) * 1px), calc(var(--ty) * 1px)); }
  .g-tick[data-state="at-sat2"] { --tx: 1640; --ty: 310; }
  .g-tick[data-state="at-phone"] { --tx: 2210; --ty: 1430; }
  .tk-body { opacity: 0; }
  .g-tick[data-state] .tk-body { opacity: 1; }
  .tk-glow { fill: var(--c-accent); fill-opacity: .14; }
  .tk-ring2 { fill: none; stroke: var(--c-accent); stroke-opacity: .4; stroke-width: 4; }
  .tk-ring { fill: var(--c-accent); fill-opacity: .2; stroke: var(--c-accent); stroke-width: 6; }
  .tk-core { fill: var(--c-accent); }
  /* signal path and distance arcs: off until their state is on */
  .g-beam { fill: none; stroke: var(--c-accent); stroke-opacity: .55; stroke-width: 5; stroke-linecap: round; }
  #trail, #beams, #arcs3, #arcsOff, #arc4, #fix { opacity: 0; }
  #trail[data-state="on"], #beams[data-state="on"], #arcs3[data-state="on"], #arcsOff[data-state="on"], #arc4[data-state="on"], #fix[data-state="on"] { opacity: 1; }
  .g-arc { fill: none; stroke: var(--c-secondary); stroke-width: 8; stroke-linecap: round; }
  #arc4 .g-arc { stroke: var(--c-accent); }
  #arcsOff .g-arc { stroke-opacity: .85; stroke-dasharray: 18 14; }
  .fx-halo { fill: var(--c-primary); fill-opacity: .2; }
  .fx-ring { fill: none; stroke: var(--c-primary); stroke-width: 6; }
  .fx-dot { fill: var(--c-primary); }
</style>
