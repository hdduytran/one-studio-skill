<!-- Calendar fix card and a warning bubble -->
<div class="ui-card">
  <div class="os-muted" style="font-size:calc(24 * var(--u));">Lịch</div>
  <div class="serif" style="font-size:calc(56 * var(--u)); margin-top:calc(10 * var(--u));">Xem nhà</div>
  <div style="font-size:calc(32 * var(--u)); margin-top:calc(18 * var(--u)); text-decoration:line-through; text-decoration-color:var(--c-accent); text-decoration-thickness:calc(5 * var(--u));">Thứ Bảy, 14:00</div>
  <div class="os-accent" style="font-size:calc(32 * var(--u)); margin-top:calc(10 * var(--u));">→ Chủ Nhật, 14:00</div>
</div>
<div class="bubble" style="margin-top:calc(30 * var(--u)); background:var(--cream); box-shadow:var(--shadow);">Buổi xem nhà này đang bị ghi nhầm ngày. Mình sửa lại nhé?</div>
