<!-- Dashboard card with tiles and bars -->
<div class="ui-card" style="padding:calc(36 * var(--u));">
  <div class="serif" style="font-size:calc(40 * var(--u));">Doanh thu tuần</div>
  <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:calc(18 * var(--u)); margin-top:calc(24 * var(--u));">
    <div class="os-muted" style="background:var(--ink-soft); border-radius:calc(18 * var(--u)); height:calc(110 * var(--u)); padding:calc(18 * var(--u)); font-size:calc(24 * var(--u));">Doanh thu</div>
    <div class="os-muted" style="background:var(--ink-soft); border-radius:calc(18 * var(--u)); height:calc(110 * var(--u)); padding:calc(18 * var(--u)); font-size:calc(24 * var(--u));">Đơn hàng</div>
    <div class="os-muted" style="background:var(--ink-soft); border-radius:calc(18 * var(--u)); height:calc(110 * var(--u)); padding:calc(18 * var(--u)); font-size:calc(24 * var(--u));">Khách mới</div>
  </div>
  <div style="display:flex; align-items:flex-end; gap:calc(22 * var(--u)); height:calc(240 * var(--u)); margin-top:calc(40 * var(--u));">
    <div style="flex:1; height:40%; border-radius:calc(10 * var(--u)); background:var(--c-secondary)"></div>
    <div style="flex:1; height:55%; border-radius:calc(10 * var(--u)); background:var(--c-secondary)"></div>
    <div style="flex:1; height:48%; border-radius:calc(10 * var(--u)); background:var(--c-secondary)"></div>
    <div style="flex:1; height:70%; border-radius:calc(10 * var(--u)); background:var(--c-secondary)"></div>
    <div style="flex:1; height:85%; border-radius:calc(10 * var(--u)); background:var(--c-accent)"></div>
  </div>
</div>
