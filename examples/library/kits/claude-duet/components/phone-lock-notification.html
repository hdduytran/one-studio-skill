<!-- Phone lock screen with a notification -->
<div class="phone" style="position: relative;">
  <div class="status"><span>7:00</span><span>●●● ▮</span></div>
  <div class="serif" style="text-align:center; font-size:calc(96 * var(--u)); margin-top:calc(40 * var(--u));">7:00</div>
  <div class="os-muted" style="text-align:center; font-size:calc(22 * var(--u));">Thứ Năm, 22 tháng 10</div>
  <div class="ui-card" style="margin-top:calc(60 * var(--u)); padding:calc(22 * var(--u)); border-radius:calc(24 * var(--u)); background:var(--ink-soft); box-shadow:none;">
    <div class="row-gap" style="font-size:calc(20 * var(--u));"><span class="mark"><span class="dot"></span></span><span>Duet</span><span class="os-muted" style="margin-left:auto">bây giờ</span></div>
    <div style="font-size:calc(24 * var(--u)); margin-top:calc(12 * var(--u));">Sáng nay có 3 việc cần bạn:</div>
    <div style="font-size:calc(22 * var(--u)); margin-top:calc(10 * var(--u)); line-height:1.5;">· Hạn chót tuyển dụng hôm nay<br/>· Hợp đồng chờ bạn xem lại<br/>· Giấy phép cần duyệt</div>
  </div>
</div>
