<!-- Approval card and an always-blocked row -->
<div class="ui-card">
  <div class="row-gap"><span class="dot"></span><span class="os-accent" style="font-size:calc(24 * var(--u));">Cần bạn duyệt</span></div>
  <div class="serif" style="font-size:calc(48 * var(--u)); margin-top:calc(14 * var(--u));">Gửi email báo giá cho khách?</div>
  <div style="margin-top:calc(22 * var(--u)); display:flex; flex-direction:column; gap:calc(12 * var(--u));">
    <div style="height:calc(16 * var(--u)); width:92%; background:var(--ink-soft); border-radius:calc(8 * var(--u));"></div>
    <div style="height:calc(16 * var(--u)); width:70%; background:var(--ink-soft); border-radius:calc(8 * var(--u));"></div>
  </div>
  <div class="row-gap" style="justify-content:flex-end; margin-top:calc(30 * var(--u));">
    <span class="chip" style="box-shadow:none; border:calc(2 * var(--u)) solid var(--c-muted); background:transparent;">Sửa</span>
    <span class="chip" style="box-shadow:none; background:var(--c-accent); color:var(--cream);">Duyệt</span>
  </div>
</div>
<div class="ui-card" style="margin-top:calc(30 * var(--u)); padding:calc(24 * var(--u)) calc(40 * var(--u)); display:flex; align-items:center; gap:calc(20 * var(--u));">
  <svg style="width:calc(40 * var(--u)); height:calc(40 * var(--u));" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2" fill="var(--c-fg)"/><path d="M8 11V8a4 4 0 0 1 8 0v3" fill="none" stroke="var(--c-fg)" stroke-width="2"/></svg>
  <span style="font-size:calc(30 * var(--u));">Chuyển tiền giữa tài khoản</span>
  <span class="os-muted" style="margin-left:auto; font-size:calc(26 * var(--u));">Luôn bị chặn</span>
</div>
