<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1920, height=1080" />
<!-- one-studio scene s03 (data). Edit content and the timeline only; styles come from brand tokens. -->
<link rel="stylesheet" href="../assets/brand.css" />
<link rel="stylesheet" href="../assets/os.css" />
<script src="../assets/vendor/gsap.min.js"></script>
<script src="../assets/brand.js"></script>
<script src="../assets/os.js"></script>
</head>
<body>
<div id="root" class="os-scene" data-composition-id="s03" data-start="0" data-duration="12" data-width="1920" data-height="1080"
     data-transition-in="fade" data-transition-out="fade" data-transition-duration="0.4"
     style="--w: 1920px; --h: 1080px">
  <div class="os-frame clip" data-start="0" data-duration="12" data-track-index="0">
    <h2 class="os-h2">Sai số định vị theo số vệ tinh</h2>
    <div class="os-chart" style="flex: 1 1 auto; min-height: 0"></div>
  </div>
</div>
<script>
  const rows = [{"satellites":1,"error_m":20000},{"satellites":2,"error_m":3000},{"satellites":3,"error_m":150},{"satellites":4,"error_m":5}];
  const bars = OS.barChart(".os-chart", rows, { highlight: "last", scale: "log", label: "satellites", value: "error_m",
    labelFormat: (n) => n + " vệ tinh", format: (v) => v.toLocaleString("vi-VN") + " m" });
  const S = OS.scene("s03");
  S.enter(".os-h2", { at: 0.2 });
  S.bars(bars, { at: 0.8 });
  S.count(".os-bar-value", { at: 0.8, suffix: " m" });
  S.enter(".os-bar-label", { at: 0.6, kind: "fade", stagger: 0.1 });
  S.done();
</script>
</body>
</html>
