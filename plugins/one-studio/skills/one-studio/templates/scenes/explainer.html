  <div class="os-frame clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
    <h2 class="os-h2">{{headline}}</h2>
    <div class="os-diagram fig-wrap" style="flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center">
      <!-- figure:start -->
      <!-- anatomy-to-svg.mjs <figure.html> --into <project> {{id}} replaces this block with the figure SVG -->
      <svg class="placeholder" viewBox="0 0 600 380"><rect class="stroke" x="150" y="90" width="300" height="200" rx="16" /></svg>
      <!-- figure:end -->
    </div>
  </div>
</div>
<script>
  const S = OS.scene("{{id}}");
  const fig = S.root.querySelector(".fig-wrap > svg");
  fig.style.maxHeight = "100%";
  S.enter(".os-h2", { at: 0.2 });
  // Slow camera: start close on the subject, pull back to the whole machine.
  S.tl.fromTo(fig, { scale: 1.25, transformOrigin: "50% 50%" }, { scale: 1, duration: S.dur * 0.6, ease: "power2.inOut" }, 0);
  S.enter(fig, { at: 0.1, kind: "fade" });
  // Reveal / move named parts in step with the VO, e.g.:
  // S.enter('[data-part="carriage"]', { at: 2, kind: "left" });
  // S.tl.to('[data-part="needle"]', { rotation: 40, svgOrigin: "300 120", duration: 1 }, 4);
  S.done();
</script>
</body>
</html>
